name: g1_extended
description: "Android companion app for Even Realities G1 smart glasses — offline, no account, no telemetry"
publish_to: "none"

version: 1.1.0+4

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # --- Bluetooth / G1 protocol ---
  flutter_blue_plus: ^1.34.5
  crc: ^0.0.2
  mutex: ^3.1.0

  # --- Background operation & notifications ---
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^18.0.1
  notification_listener_service: ^0.3.4
  android_package_manager: ^0.7.1
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0

  # --- Credentials ---
  # Back after being removed with the account system. An assistant endpoint
  # may need an API key, and a key belongs in the keystore, not in plain
  # preferences alongside the brightness setting.
  flutter_secure_storage: ^9.2.2

  # --- Local storage ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

  # --- Dashboard content (calendar, checklists, reminders) ---
  device_calendar: ^4.3.3
  duration_picker: ^1.2.0
  fuzzywuzzy: ^1.2.0
  uuid: ^4.5.1
  intl: ^0.20.1

  # --- Weather widget (open-meteo, no API key, no account) ---
  geolocator: ^11.0.0
  http: ^1.2.2

  # --- On-device speech (no cloud) ---
  speech_to_text: ^7.0.2
  flutter_sound: ^9.2.13
  archive: ^3.6.1
  vosk_flutter:
    git:
      url: https://github.com/alphacep/vosk-flutter.git

  # --- Misc ---
  # Hands the diagnostic report to the system share sheet. No network, no
  # extra permission: the file goes wherever the user sends it.
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  build_runner: 2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  adaptive_icon_background: "#000000"
  android: true
