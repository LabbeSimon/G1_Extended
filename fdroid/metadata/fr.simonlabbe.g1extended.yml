AutoName: G1 Extended
Summary: Offline companion app for Even Realities G1 glasses
Description: |-
    Pairs with Even Realities G1 smart glasses over Bluetooth and drives their
    display: dashboard, notifications, live captions and dictation.

    There is no account and no telemetry. Speech recognition runs on the
    device. The only network requests are an optional weather forecast and a
    one-off download of the offline speech model.

RepoType: git
Repo: https://github.com/LabbeSimon/G1_Extended.git

AutoUpdateMode: Version
# Stable tags only. Plain "Tags" takes the highest tag it finds, which on this
# repository is a pre-release nine times out of ten: the beta branch is tagged
# v1.2.4-beta.11 and friends, and shipping one of those as the release build
# is exactly what the beta channel exists to avoid.
UpdateCheckMode: Tags ^v\d+\.\d+\.\d+$

# Missing on purpose, for now: a Builds: section. F-Droid compiles from source
# and Flutter applications need the SDK pinned and fetched in a prebuild step;
# writing that recipe without running it against fdroidserver would only look
# finished. IzzyOnDroid, which publishes the release APK built here, needs no
# such recipe and is the shorter route.
