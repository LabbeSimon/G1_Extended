name: Build APK

on:
  push:
    branches:
      - "**"
    # A release is cut by pushing a tag, not by every commit landing on main.
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A tag is what publishes a release, and the APK reports the version
      # from pubspec.yaml — not from the tag. When the two drift apart every
      # installed copy compares its own version against the release and
      # decides it is out of date, so the update banner never goes away and
      # points at the build the user already has. That happened: v1.0.3 was
      # cut while pubspec still said 1.0.0.
      - name: Tag must match the version in pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # Exactly, pre-release suffix included. The app compares versions
          # by semantic versioning rules, where 1.1.2-beta.6 and 1.1.2 are
          # different versions — so a beta whose pubspec said plain 1.1.2
          # would compare equal to itself and never offer the next one.
          pubspec="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          if [ "$tag" != "$pubspec" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pubspec version $pubspec."
            echo "::error::Every install would be told it is out of date, forever."
            exit 1
          fi
          echo "::notice::tag and pubspec agree on $pubspec"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The native LC3 decoder needs an NDK. Downloading a pinned one costs
      # 1.7 GB and used to fill the runner's disk, so build against the NDK
      # the image already ships and let build.gradle pick it up.
      - name: Use the preinstalled Android NDK
        run: |
          set -euo pipefail
          NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_HOME" ] || [ ! -d "$NDK_HOME" ]; then
            echo "No preinstalled NDK found on this runner." >&2
            exit 1
          fi
          echo "ANDROID_NDK_VERSION=$(basename "$NDK_HOME")" >> "$GITHUB_ENV"
          echo "Building against NDK $(basename "$NDK_HOME")"

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # The signing key lives in repository secrets, never in the repository.
      # Without them the build still runs and produces a debug-signed APK,
      # so a fork or a pull request is not blocked by a key it cannot have.
      - name: Restore the signing key
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore/release.jks
          cat > android/keystore.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=release
          storeFile=../app/keystore/release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Disk space before build
        run: df -h /

      # Surfaces the real error as a GitHub annotation. Without this a failed
      # Gradle build shows up only as "Process completed with exit code 1",
      # and the cause stays buried in the step log.
      - name: Confirm how the APK was signed
        if: always()
        run: |
          if [ -f android/app/keystore/release.jks ]; then
            # A notice rather than a plain echo: annotations are readable
            # without a token, so the outcome can be confirmed from outside
            # the run rather than inferred from the absence of a warning.
            FINGERPRINT=$(keytool -list -v \
              -keystore android/app/keystore/release.jks \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" 2>/dev/null \
              | grep -m1 'SHA256:' | tr -d ' ' || true)
            echo "::notice::Release key in place. $FINGERPRINT"
          else
            echo "::warning::No signing key available, this APK is debug-signed and cannot be published."
          fi

      - name: Build release APK
        run: |
          set -o pipefail
          # x86_64 is emulator-only and adds ~29 MB. This app needs Bluetooth LE
          # hardware, so an emulator build serves no purpose.
          #
          # Split by architecture: a universal build carries native code for
          # every processor, and all but one set is dead weight on any given
          # phone — about half the download. The app asks Android what it is
          # and fetches the matching build, so the split is invisible except
          # in how long an update takes.
          if ! flutter build apk --release --split-per-abi \
               --target-platform android-arm,android-arm64 2>&1 | tee build.log; then
            echo "::error::APK build failed. Last 40 lines follow."
            tail -40 build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            df -h / | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      # A key on a runner outlives the job otherwise, and runners are reused.
      - name: Remove the signing key
        if: always()
        run: rm -f android/app/keystore/release.jks android/keystore.properties

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: g1-extended-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  # Only for a pushed tag. Every other commit still produces the APK above as
  # a downloadable artifact; it just does not create a version nobody asked
  # for. Cut a release with:  git tag v1.1.0 && git push origin v1.1.0
  release:
    name: Publish release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: g1-extended-apk
          path: apk

      - name: Name each APK after the tag and its architecture
        run: |
          set -euo pipefail
          for path in apk/app-*-release.apk; do
            file="$(basename "$path")"
            # app-arm64-v8a-release.apk -> arm64-v8a
            abi="${file#app-}"
            abi="${abi%-release.apk}"
            mv "$path" "apk/g1-extended-${GITHUB_REF_NAME}-${abi}.apk"
          done
          ls -la apk/

      # Which one to download, for anyone reading the release page rather
      # than letting the app do it. Almost every phone since 2017 is arm64.
      - name: Say which build is which
        run: |
          {
            echo ""
            echo "---"
            echo ""
            echo "**Which file?** \`arm64-v8a\` for essentially any phone made"
            echo "since 2017. \`armeabi-v7a\` only for older 32-bit devices."
            echo "The app picks the right one by itself when it updates."
          } > notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: apk/*.apk
          generate_release_notes: true
          body_path: notes.md
          append_body: true
          # A suffixed tag publishes as a pre-release. GitHub keeps
          # pre-releases out of /releases/latest, which is the endpoint the
          # in-app update check reads — so people on stable are never told
          # to "update" to a beta, and beta testers pick theirs up from the
          # releases page deliberately.
          prerelease: ${{ contains(github.ref_name, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}
