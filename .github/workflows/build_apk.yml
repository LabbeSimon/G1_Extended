name: Build APK

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The native LC3 decoder needs an NDK. Downloading a pinned one costs
      # 1.7 GB and used to fill the runner's disk, so build against the NDK
      # the image already ships and let build.gradle pick it up.
      - name: Use the preinstalled Android NDK
        run: |
          set -euo pipefail
          NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_HOME" ] || [ ! -d "$NDK_HOME" ]; then
            echo "No preinstalled NDK found on this runner." >&2
            exit 1
          fi
          echo "ANDROID_NDK_VERSION=$(basename "$NDK_HOME")" >> "$GITHUB_ENV"
          echo "Building against NDK $(basename "$NDK_HOME")"

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Disk space before build
        run: df -h /

      # Surfaces the real error as a GitHub annotation. Without this a failed
      # Gradle build shows up only as "Process completed with exit code 1",
      # and the cause stays buried in the step log.
      - name: Build release APK
        run: |
          set -o pipefail
          # x86_64 is emulator-only and adds ~29 MB. This app needs Bluetooth LE
          # hardware, so an emulator build serves no purpose.
          if ! flutter build apk --release \
               --target-platform android-arm,android-arm64 2>&1 | tee build.log; then
            echo "::error::APK build failed. Last 40 lines follow."
            tail -40 build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            df -h / | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: g1-extended-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Increment tag version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          create_annotated_tag: true

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: g1-extended-apk
          path: apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          files: apk/app-release.apk
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
