plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Load keystore properties from external file
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def useReleaseKeys = false
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    // Only set to true if both the file exists and the keystore file actually exists
    def keystoreFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
    useReleaseKeys = keystoreFile != null && keystoreFile.exists()
}

def appDisplayName = "G1 Extended"

android {
    namespace = "fr.simonlabbe.g1extended"
    compileSdk = flutter.compileSdkVersion
    // The native LC3 decoder builds against whatever NDK is available.
    // CI sets ANDROID_NDK_VERSION to the one already on the runner, which
    // avoids a 1.7 GB download that used to exhaust the runner's disk.
    ndkVersion = System.getenv('ANDROID_NDK_VERSION') ?: "27.0.11902837"

    // Add signing configs for release builds
    signingConfigs {
        debug {
            // Use debug keys by default
        }
        release {
            // Only apply release signing config if keystore file exists
            if (useReleaseKeys) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
  
    compileOptions {
        // Desugaring lets minSdk 24 use the newer language APIs.
        coreLibraryDesugaringEnabled true
        // Matches the current Flutter template. Staying on 1.8 clashes with
        // plugins that now compile at 11 or 17.
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // Emulator-only architectures. Neither ndk.abiFilters nor
            // --target-platform catches prebuilt libraries shipped inside a
            // plugin's AAR, which is how Vosk's 9 MB x86_64 binary kept
            // ending up in the APK.
            excludes += ['**/x86_64/**', '**/x86/**']
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    defaultConfig {
        applicationId = "fr.simonlabbe.g1extended"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24 // minimum SDK version for speech_to_text
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
        // Only filters libraries the NDK builds here. Flutter's own engine and
        // prebuilt plugin libraries such as Vosk ignore it, so the ABI list
        // also has to be passed to `flutter build` (see the CI workflow).
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        
        // Inject display name as a string resource so AndroidManifest can reference it
        resValue "string", "app_name", appDisplayName

        // Add the required manifest placeholders
        // io.flutter.app.FlutterApplication belonged to the v1 embedding and no
        // longer exists. App is this project's own Application subclass; it
        // registers the lifecycle callbacks BackgroundService depends on.
        manifestPlaceholders = [
            'applicationName': 'fr.simonlabbe.g1extended.App'
        ]
    }

    buildTypes {
        release {
            // Only use release signing config if keystore exists, otherwise use debug signing
            signingConfig useReleaseKeys ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            minifyEnabled true
            shrinkResources true
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'
  // Kotlin coroutines for async operations
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
