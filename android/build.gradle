allprojects {
    repositories {
        google()
        mavenCentral()
        // Vosk is published through JitPack.
        maven { url 'https://jitpack.io' }
    }
}

// Applies to every module, plugins included. Placing this at the root is the
// whole point: the same block inside app/build.gradle silently did nothing,
// because :app has no subprojects of its own, which left plugins such as
// vosk_flutter compiling against android-33.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                // Older plugins predate the namespace requirement of AGP 8.
                if (namespace == null) {
                    namespace project.group
                }
                // AndroidX now requires its consumers to compile against 34+.
                compileSdkVersion 36
            }
        }
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
